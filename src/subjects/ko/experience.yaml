- companyName: (주)원더라운드
  startDate: '2025.04.14'
  activities:
    - id: wonder-rn-app-2026
      startDate: '2026.02.04'
      title: '직무 전환 - React Native (CLI) 기반 자사 모바일 애플리케이션 개발 및 유지보수'
      doneList:
        - subject: 'OTA(무선 코드 배포) 인프라 `hot-updater` 신규 도입 및 운영 체계 구축'
          details:
            - '스토어 심사 주기에 묶여 긴급 버그 수정과 QA 반영이 지연되던 구조를 해소하기 위해, JS 번들을 심사 없이 무선 배포하는 OTA 파이프라인을 `hot-updater`로 신규 도입. 번들 저장소 연동, iOS / Android 및 `dev` / `beta` / `pro` 환경별로 관리하는 체계 구성, 배포·롤백 운영 흐름까지 전반을 설계·구축'
            - problem: '초기에는 전 환경이 채널·설정을 공유하여, 상위 환경 번들이 하위 환경 네이티브에 덮어써지거나 배포 전 설정 스왑을 누락하면 번들-네이티브가 불일치. 잘못된 키 설정으로 소셜 로그인이 크래시되는 사고가 반복'
              solution: '배포 목적지를 `appVersion` + 채널(`dev` / `beta` / `production`) 조합으로 격리하고, 채널·환경 설정을 빌드 시점에 주입하도록 자동화. `set-<env>` → 배포 → `dev` 복원 절차를 표준화하여 번들이 항상 의도한 환경에만 도달하도록 칸막이를 확립'
            - problem: '특정 상황에서 앱이 강제 업데이트(`force update`) 무한 루프에 빠져 정상 진입 자체가 불가능한 치명적 현상 발생'
              solution: '부팅 실패 루프를 관측 가능하게 만드는 롤백 계측(현재 번들 id === 최소 번들 id → 부팅 실패로 확정)을 추가하고, 콘솔·DB로 즉시 회수 가능한 수동 킬스위치를 확보하여 장애 대응 경로를 마련'

        - subject: 주요 화면의 진입 성능 최적화를 위한 단계적 마운트 패턴 도입
          details:
            - problem: '리스트 / 지도 / 상세 등 다수의 `hooks`와 API 호출이 누적되는 무거운 화면에서, 진입 시점에 위젯이 동시 마운트되며 네비게이션 애니메이션이 끊기고 `skeleton` 노출이 지연되는 문제 발생'
              solution: '진입점과 본문을 두 단계로 분리하여, 네비게이션 전환 직후에는 `skeleton`만 즉시 노출하고 transition 종료 시점을 `setImmediate`로 감지하여 본문이 애니메이션 종료 이후에만 마운트되도록 처리. 체감 진입 지연을 약 700~800ms 수준에서 200~300ms 수준으로 단축'
            - '화면 상단에 노출되는 데이터는 별도 `prefetch` 훅으로 사전에 워밍업하여, 본문 마운트 시점에 캐시 히트되도록 설계'
            - 스크롤 이벤트 핸들러를 JS 스레드 비차단 방식으로 처리하는 공통 훅을 도입하여, 스크롤 중에도 다른 인터랙션이 지연되지 않도록 개선

        - subject: 푸시 알림 및 딥링크 기반 진입 동선 구축
          details:
            - problem: 콜드 스타트 상태에서 푸시 클릭 시 네비게이션 스택이 준비되지 않아, 라우팅이 누락되는 케이스 발생
              solution: '전역 `store`에 `pending payload`를 적재하고, 네비게이션 `ready` 시점에 큐를 소비하여 라우팅하도록 비동기 큐 패턴 적용'
            - problem: 푸시 딥링크 목적지가 웹뷰 화면인 경우, 콜드 스타트로 진입하면 네비게이션 스택이 해당 웹뷰 단일 화면만 갖게 되어 뒤로가기 시 앱 내부 화면으로 복귀하지 않고 앱 자체가 종료되는 문제 발생
              solution: '단순 `navigate` 호출 대신 `navigation state`를 직접 구성하여, `BottomTabs`를 베이스 라우트로 두고 그 위에 `Stack`(연관 underlay 화면 + 웹뷰)을 쌓는 형태로 `reset`. 뒤로가기 시 웹뷰 → 연관 화면 → `BottomTabs` 순서로 자연스럽게 이탈하도록 흐름을 보장'
            - 백엔드 푸시 발송 API 스키마 변경에 맞춰 알림 목록 응답을 정규화하는 레이어 도입
            - '푸시 페이로드를 파싱하여 콜드 스타트 / 백그라운드 / 포그라운드 각 진입 케이스를 분기 처리하는 딥링크 핸들러 구현'

        - subject: '`TanStack Query` 낙관적 업데이트 패턴 도입 및 표준화'
          details:
            - '북마크 / 좋아요 등 토글성 `mutation`에 `cancel → snapshot → cache update → rollback` 흐름을 표준화하여, 서버 응답 전 즉시 UI 반영과 실패 시 일관된 롤백을 팀 전반에 확립. `setQueryData` 기반 캐시 직접 패치로 불필요한 `invalidate` 라운드트립도 제거'

        - subject: Claude Code 기반 개발 생산성 인프라 구축
          details:
            - 기존 RN 앱 담당 개발자의 퇴사로 도메인 지식 인계가 끊긴 상태에서, RN 앱 개발 경험이 부족한 채로 단독으로 유지보수와 신규 기능 개발을 동시에 진행해야 하는 환경에 놓임. 학습 비용 절감과 도메인 컨텍스트의 항시 참조를 위해 Claude Code 기반 보조 인프라를 직접 설계 및 구축
            - '프로젝트 규칙을 UI 생태계 / 성능 / 애니메이션 / 서버 상태 / 네비게이션 / 전역 상태 / 다국어 / 신규 기능 흐름 등 도메인별로 분리하여, 작업 키워드 기반으로 필요한 규칙만 부분 적재되는 구조로 설계'
            - '역할 분리 멀티에이전트 파이프라인 — `planner → generator → evaluator` 구현 루프에 더해, 분석 결과를 별도 `critic` 에이전트가 객관적으로 반박·검증하는 자기검증 레인을 구성하여 단일 컨텍스트 자기검증의 편향을 완화'
            - '반복 구현 패턴의 스킬화 — API 추가 / 낙관적 업데이트 뮤테이션 / 화면 진입 최적화 / 다국어 반영 등 정형화된 작업을 재사용 가능한 커맨드로 코드화하여, 컨벤션을 매번 재설명하지 않고도 일관된 산출물을 확보'
            - '작업 복잡도에 따라 모델을 라우팅(경량 조회 → 아키텍처·심층 분석)하고, 프롬프트 캐싱·추론 강도(effort)를 튜닝하여 응답 지연과 토큰 비용을 최적화'

    - id: wonder-admin-travel-2025
      startDate: '2025.07.03'
      endDate: '2025.10.16'
      title: 자사 여행 콘텐츠 예약 및 결제 플랫폼의 관리자 페이지 개발
      doneList:
        - subject: '상품 / 패키지의 생성 및 수정 폼 페이지 개발'
          details:
            - '`Tiptap` 에디터와 `react-hook-form`의 `FormField`를 결합하여, 언어별 탭 UI로 제목 / 설명 / 이미지를 분리 입력할 수 있도록 개발 (한국어, 영어, 일본어, 중국어 간체, 중국어 번체)'
            - 날짜 기간별 데이터를 관리하는 폼을 구현하고, 특정 날짜 또는 공휴일을 선택해 일괄적으로 데이터를 수정할 수 있는 기능을 개발
            - '`zustand`로 상품/패키지 폼 데이터를 관리하고 `localStorage`에 저장하여 페이지 이탈 후에도 복구가 가능한 임시저장 기능 개발. `JSON` 파싱을 `Zod` 스키마로 검증해 안정성을 높임'
            - problem: '`react-hook-form`의 `useFieldArray` 로 관리되는 데이터에서, 서버에서 주는 데이터의 `id`와 `useFieldArray` 자체 key인 `id` 간의 충돌로 인해 기존 데이터와 새로 추가된 데이터가 구분되지 않아, 잘못된 데이터가 전달될 위험 발생'
              solution: '`useFieldArray`의 `keyName`에 커스텀 ID를 부여해 데이터 기존 / 새 데이터를 명확히 구분하고, 사용자가 수정한 데이터를 정확하게 반영하도록 구현'
            - problem: 각각의 다국어 이미지 등록 시, 영어를 기준으로 이미지를 복사해 다른 언어의 이미지에도 업로드하도록 구현했으나, 동일한 이미지의 업로드 API 요청이 복사된 언어의 수만큼 중복 호출되는 문제가 발생
              solution: 영어 버전 이미지의 `ID`를 다른 언어들과 공유하도록 구조를 변경하여, 동일 이미지의 중복 업로드 문제를 완화함. 또한 이미지를 교체할 때는 공유된 이미지 ID를 기준으로 연동된 모든 언어의 이미지가 함께 교체되도록 처리하여 일관성을 유지함

        - subject: i18next를 활용한 다국어 기능 개발 (영어, 중국어 간체 / 번체)
          details:
            - zod validation의 에러 메시지 + dayjs 시간 포메팅 표현을 다국어로 구현
            - problem: 모든 번역 `JSON` 파일을 한 번에 번들링하면 초기 로딩 속도가 느려지는 성능 문제가 발생
              solution: '`resourcesToBackend`를 활용해 필요한 언어와 namespace만 동적으로 import하는 lazy loading 방식으로 개선하여 로딩 성능 최적화'
            - problem: zod의 refine 등을 활용한 커스텀 에러 메시지는 React 초기화 시점에 메시지 값이 고정되어, 언어를 변경해도 에러 메시지의 언어가 변경되지 않는 문제에 직면
              solution: 검증 로직에서는 에러 메시지의 번역 키만 저장하고, 화면 렌더링 시점에 번역 로직을 적용하도록 개선하여, 언어 변경 시 기존 에러 메시지도 실시간으로 변경되도록 구현
    - id: wonder-wix-migration-2025
      startDate: '2025.09.24'
      endDate: '2025.10.02'
      title: Wix로 제작된 여행 플랫폼 웹사이트를 Next.js 환경으로 전환
      doneList:
        - subject: '반응형 디자인 구현 (데스크톱 / 태블릿 / 모바일) 및 Docker / ECR / GitHub Actions 기반 CI/CD 파이프라인 구축'

    - id: wonder-admin-enhance-2025
      startDate: '2025.04.14'
      endDate: '2025.07.02'
      title: 자사 애플리케이션 관리자 페이지 시스템 고도화 및 유지보수
      doneList:
        - subject: 기존 관리자 페이지 기능 리뉴얼
          details:
            - 리스트 페이지에서 특정 아이템 선택 시, 이미지와 종속 하위 데이터를 포함한 값을 생성 폼에 사전 입력하는 복사 기능 개발
            - 중요 콘텐츠 수정 시, 각 필드의 변경 전후 값을 `JSON` 형태로 시각화하여 변경 이력을 추적하는 UI 구현
            - '`Toast UI Editor`를 `Tiptap Editor`로 교체, 에디터 내부의 이미지 업로드 로딩 및 업로드 중 삭제 처리 등의 기능 확장'
            - '`react-easy-crop`으로 이미지 편집(Crop/Zoom) UI를 구현'
        - subject: 트래픽 / 유저 활동 / 콘텐츠 데이터를 활용한 대시보드 페이지 기획 및 구현
          details:
            - '`Recharts` 라이브러리를 도입하여 라인 / 바 / 파이 차트 UI를 구현하고, 각 차트별로 레이블, 축, 툴팁 등을 커스터마이징'
            - 각 연도의 월별 데이터를 집계하여 평균값으로 계산하고, 이를 차트에 시각화하여 한눈에 연간 추세와 월별 변화를 파악할 수 있도록 기능 구현
            - '기간을 선택하여 데이터를 조회할 시, 선택한 기간과 동일한 이전 기간 데이터를 비교하여 나타내는 기능 개발 (예: 최근 7일 vs 그 이전의 7일)'
            - problem: '7일 전 / 14일 전 등의 `Select` 박스를 통해 기간을 선택할 수 있도록 구현했지만, 매 선택 시마다 새로운 데이터 호출을 위해 전체 화면이 다시 렌더링되는 UX 이슈 발생'
              solution: '각 `Select` 옵션에 대응하는 데이터셋을 사전에 `prefetch`하여, 선택 시 화면 전환 없이 즉각적으로 데이터를 교체할 수 있도록 구성해 UX를 개선'
            - problem: 원하는 날짜 기간을 선택하여 통계 데이터를 조회할 때, 의도하지 않은 다른 쿼리까지 함께 다시 호출되는 현상이 발생
              solution: 고정된 데이터 쿼리와 기간별 통계 데이터를 분리하여 정의함으로써 쿼리 단위로 명확하게 캐시를 구분. API 호출을 최소화하여 문제 보완
        - subject: '`vitest`를 도입하여 관리자 페이지 전반적인 기능에 대한 TDD 테스트 코드 작성'
          details:
            - problem: '기존에 설계된 `React Router` 기반 컴포넌트들이 테스트 환경(`Vitest` + `JSDOM`)에서 정상적으로 화면이 렌더링되지 않거나 이동되지 않는 현상 발생'
              solution: '`MemoryRouter`와 `TanStack Query Provider`를 포함한 커스텀 렌더링 유틸을 구성. 중첩 라우팅과 라우팅 상태를 `mock` 방식으로 구성하여 테스트 환경을 실제 실행 환경과 유사하게 설계하여 문제를 해결'
            - problem: '`Dropdown`, `Modal` 등 `Portal`을 사용하는 특정 컴포넌트들이 테스트 환경에서 트리거 요소의 클릭 이벤트를 감지하지 못하고, 실제 UI 흐름과 다른 방식으로 렌더링됨'
              solution: '테스트 환경의 화면 플로우를 실제 유저처럼 매끄럽게 트리거하는 `userEvent`를 도입하여 해결'
- companyName: 한국글로벌널리지네트웍(주)
  startDate: '2024.03.11'
  endDate: '2025.03.21'
  activities:
    - id: kgkn-admin-site-2025
      startDate: '2025.01.16'
      endDate: '2025.03.21'
      title: 기존 자사 플랫폼의 전용 관리자 사이트 개발
      doneList:
        - subject: 퀴즈에 필요한 문제 은행 관리 기능 개발
          details:
            - '보기의 추가·수정·삭제 후 `TanStack Query`의 `invalidateQueries`로 데이터 신선도를 유지하고, 최신 보기 데이터를 기반으로 정렬한 뒤 순서 변경 API를 호출해 정확성을 보장'
        - subject: 강의 구성 단위(챕터 / 섹션 / VOD / 퀴즈 / 실습) 관리 기능 개발
          details:
            - problem: 실습, VOD 등에 따라 요구되는 설정 값이 달라 일관된 폼을 제공하기 어려웠고, UI 복잡성이 증가하는 문제가 발생
              solution: 각 콘텐츠 유형별로 독립적인 폼을 구성하고, 선택된 유형에 따라 동적으로 렌더링하도록 개선하여 UI 복잡성을 완화하고 사용성을 개선
    - id: kgkn-external-course-2024
      startDate: '2024.11.18'
      endDate: '2025.01.15'
      title: 외부 기업 전용 강의 수강 사이트 / 관리자 & 운영자 사이트 개발
      doneList:
        - subject: WebSocket을 활용하여 실시간 강의 중 강사와 수강생들의 즉각적인 상호작용이 가능한 돌발 퀴즈 기능 개발
          details:
            - problem: 실시간 데이터 기반 차트가 매우 빠른 속도로 갱신되어 실제 데이터 값을 렌더링하지 못하는 문제 발생
              solution: '결과 데이터 상태 값에 `throttle`을 적용하여 불필요한 업데이트를 줄이고, 데이터 유실 없이 안정적으로 렌더링되도록 개선. 초당 최대 약 1500회 (실시간 미팅 접속 중인 인원 수, 약 1500명) → `throttle` 적용 후 50ms당 1회로 제한 (초당 약 20회). 이후 CPU 사용률 약 20% 감소'
            - problem: 돌발 퀴즈 시작 직전에 네트워크가 끊겼다가 다시 연결되면, 방금 진행한 돌발 퀴즈가 뜨지 않는 문제에 직면
              solution: 재연결 로직을 추가. 기존 웹소켓 핑퐁의 count 값을 비교하여, 개수가 다른 상태로 웹소켓이 연결되면 재연결로 판단. 이후 진행 중인 돌발 퀴즈를 다시 불러오도록 API를 호출하여 문제 해결
            - problem: 다수의 유저가 동시에 재연결 시도할 경우, 서버 부하가 발생할 가능성이 있음
              solution: '재연결 시도에 지수 백오프를 적용하고, 약간의 오차를 주는 랜덤성을 추가하여 동시에 발생하는 요청을 분산시켜 서버 부하를 최소화. 동시 재연결 요청 수 최대 약 1500회 (실시간 미팅 접속 중인 인원 수, 약 1500명) → 최대 동시 재연결 요청 수 약 1/10 (약 150회)로 감소'
        - subject: 관리자와 운영자의 역할에 맞는 기능 및 권한을 구분한 UI 설계
          details:
            - problem: '특정 권한이 필요한 URL에 접근할 때, 접근 전 사용자의 권한을 확인하는 미들웨어를 `React Router DOM`의 `loader`를 이용해 구현했는데, 사용자 정보가 로드되기 전에 실행이 완료되는 문제 발생'
              solution: '권한이 필요한 페이지에 접근할 때 인증된 사용자인지 먼저 확인하는 라우트 가드 컴포넌트를 `React Router DOM`의 `Outlet`과 `Navigate`를 활용해 직접 구현. 권한이 허용되면 자식 라우트를 렌더링하고, 아닐 경우 접근을 차단하도록 처리'
    - id: kgkn-platform-enhance-2024
      startDate: '2024.10.01'
      endDate: '2024.11.15'
      title: 기존 플랫폼의 고도화 및 유지보수
      doneList:
        - subject: 무한 스크롤 / Drag & Drop이 가능한 테이블 컴포넌트 개발
          details:
            - problem: 무한 스크롤에서 각 `row` 높이의 측정값이 일정하지 않아 가상화된 테이블에서 스크롤 시 데이터가 보이지 않거나 UI가 밀리는 문제 발생
              solution: '초기 `row` 높이를 추정하는 `estimateSize` 값을 설정하고, 이후 실제 렌더링된 `row`의 높이를 측정하여 동적으로 업데이트하여 문제 해결'
    - id: kgkn-coding-test-2024
      startDate: '2024.08.02'
      endDate: '2024.10.01'
      title: 코딩테스트 전용 플랫폼 개발
      doneList:
        - subject: '`CodeMirror`를 커스터마이징하여 문제풀이가 가능한 코딩 에디터 개발'
          details:
            - 라이브러리에 기본적으로 존재하는 `class`를 활용하여 CSS 스타일을 커스터마이징하고, 다크모드에서도 사용할 수 있도록 테마를 구성
            - 코드 라인이 folding (접히는) 상태이거나, 커스텀 placeholder 스타일을 적용해야 하는 경우, CSS 가상 요소를 활용해 다양한 요구사항에서도 디자인 구현
            - 태블릿 환경에서도 원활하게 사용할 수 있도록 `flex` 및 `grid`의 관련 속성들을 조합하여 반응형 디자인 적용
        - subject: 유저가 직접 코딩 테스트 문제를 풀고, 답안을 제출하여 정답 여부를 확인할 수 있는 UI 및 기능 개발
          details:
            - problem: '유저가 작성한 코드를 지속적으로 저장하도록 `zustand`의 `persist (localStorage)`를 활용했으나, 문제와 언어별로 데이터가 많아질수록 관리가 어려워지는 문제 발생'
              solution: '문제의 `id`를 객체의 `key`로 두고, 언어별로 중첩하여 유저 코드를 `JSON` 문자열로 저장, 저장 공간 최소화를 위해 최신 10개의 문제만 유지하도록 구현'
            - problem: 제출한 문제의 채점 시간이 길어져 UX가 저하되는 문제 발생
              solution: 대기 시간 동안 스켈레톤 UI를 보여주어 사용자가 대기 중임을 인지할 수 있도록 개선
        - subject: React Hook Form과 Zod를 활용해 문제를 관리하는 관리자 페이지 개발
          details:
            - problem: 문제의 상세 내용 / 언어 선택 및 메모리 제한과 시간 제한 선택 / 기본 테스트 케이스를 하나의 폼으로 구성하다 보니 UI가 복잡해지고 유지보수가 어려운 문제 발생
              solution: 관련 항목을 3가지 주요 탭으로 나누고, 각 탭 이동 시 유효성 검사를 사전에 실행하도록 개선. 유효성 검사 로직은 전역 스토어에서 관리하며, 각 탭이 마운트될 때 해당 탭의 검증 함수를 설정하여 일관된 로직을 유지
    - id: kgkn-lms-2024
      startDate: '2024.05.27'
      endDate: '2024.06.28'
      title: LMS 개발
      doneList:
        - subject: 프로젝트 설계, 공통 레이아웃과 컴포넌트 구조화, 기능 모듈화
          details:
            - problem: 이전 프로젝트는 기능을 단위별로 유지보수하기 어려워 확장성에 문제가 있다는 피드백을 받음
              solution: '효율적으로 컴포넌트와 기능을 모듈화하는 FSD 폴더 구조를 채택하여 개발. 기능의 한 단위를 "entity"로 정의하고 API, schema, type, global state를 통합 관리하여 확장성을 향상시킴'
        - subject: 시험 평가 & 과제 제출 & 설문 조사 & 마이페이지 등 주요 기능 개발
          details:
            - problem: '문제를 풀 때, "제출하기" 버튼 하나로 답안지 생성과 선택한 문제 체크까지 API 전송을 한 번에 하면 비효율적이었으며, 시험 도중 네트워크가 끊기면 데이터가 유실되는 문제가 발생'
              solution: '시험 페이지 입장 시 미리 사용자의 답안지를 생성하는 API를 전송하도록 하고, 사용자가 답안을 체크할 때마다 서버에 PATCH 요청을 보내 시험 진행 상황을 실시간으로 저장하도록 개선. 시험 진행 도중 데이터 유실률 약 50건 중 10건 → 0건으로 감소'
    - id: kgkn-online-platform-2024
      startDate: '2024.03.11'
      endDate: '2024.05.24'
      title: 온라인 IT 교육 사이트 자사 플랫폼 개발
      doneList:
        - subject: Tiptap 라이브러리를 활용하여 텍스트 에디터 커스터마이징
          details:
            - problem: 댓글 창의 애니메이션을 구현하기 위해 도입한 Framer Motion 라이브러리에서, 애니메이션을 적용한 요소가 다른 UI 요소와 겹치면서 의도하지 않은 레이아웃 변경이 발생
              solution: '애니메이션의 상태를 컴포넌트의 `key`에 주입하고 `AnimatePresence`로 컴포넌트를 감싸 레이아웃 변경을 감지하여 해결'
  note:
