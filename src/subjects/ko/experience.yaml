- companyName: (주)원더라운드
  startDate: '2025.04.14'
  activities:
    - startDate: '2026.02.04'
      title: '직무 전환 - React Native (CLI) 기반 자사 모바일 애플리케이션 개발 및 유지보수'
      doneList:
        - subject: 'OTA(무선 코드 배포) 인프라 `hot-updater` 신규 도입 및 운영 체계 구축'
          details:
            - '스토어 심사 주기에 묶여 긴급 버그 수정과 QA 반영이 지연되던 구조를 해소하기 위해, JS 번들을 심사 없이 무선 배포하는 OTA 파이프라인을 `hot-updater`로 신규 도입. 번들 저장소 연동, iOS / Android 및 `dev` / `beta` / `pro` 환경별로 관리하는 체계 구성, 배포·롤백 운영 흐름까지 전반을 설계·구축'
            - problem: '초기에는 전 환경이 채널·설정을 공유하여, 상위 환경 번들이 하위 환경 네이티브에 덮어써지거나 배포 전 설정 스왑을 누락하면 번들-네이티브가 불일치. 잘못된 키 설정으로 소셜 로그인이 크래시되는 사고가 반복'
              solution: '배포 목적지를 `appVersion` + 채널(`dev` / `beta` / `production`) 조합으로 격리하고, 채널·환경 설정을 빌드 시점에 주입하도록 자동화. `set-<env>` → 배포 → `dev` 복원 절차를 표준화하여 번들이 항상 의도한 환경에만 도달하도록 칸막이를 확립'
            - problem: '특정 상황에서 앱이 강제 업데이트(`force update`) 무한 루프에 빠져 정상 진입 자체가 불가능한 치명적 현상 발생'
              solution: '부팅 실패 루프를 관측 가능하게 만드는 롤백 계측(현재 번들 id === 최소 번들 id → 부팅 실패로 확정)을 추가하고, 콘솔·DB로 즉시 회수 가능한 수동 킬스위치를 확보하여 장애 대응 경로를 마련'

        - subject: 플랫폼 네이티브 HTTP 캐시 정책 분리 및 제어
          details:
            - problem: 'iOS / Android 네이티브 레이어의 기본 URL 응답 캐시가 일부 `GET` 요청에서 오래된 응답을 반환하여, 앱 레벨 서버 상태(`TanStack Query`)의 신선도 제어와 충돌. 사용자에게 최신 데이터가 반영되지 않는 케이스 발생'
              solution: '네이티브 요청 캐시를 플랫폼별로 분리·제어하고, 신선도가 중요한 `GET` 요청에 대해 네이티브 캐시 경로를 해제. 캐시 정책의 단일 소유권을 앱 레벨(`staleTime` 기반 쿼리)로 일원화하여, 네이티브·앱 이중 캐시로 인한 데이터 불일치를 제거'

        - subject: 주요 화면의 진입 성능 최적화를 위한 단계적 마운트 패턴 도입
          details:
            - problem: '리스트 / 지도 / 상세 등 다수의 `hooks`와 API 호출이 누적되는 무거운 화면에서, 진입 시점에 위젯이 동시 마운트되며 네비게이션 애니메이션이 끊기고 `skeleton` 노출이 지연되는 문제 발생'
              solution: '진입점과 본문을 두 단계로 분리하여, 네비게이션 전환 직후에는 `skeleton`만 즉시 노출하고 transition 종료 시점을 `setImmediate`로 감지하여 본문이 애니메이션 종료 이후에만 마운트되도록 처리. 첫 페인트 비용을 최소화하여 체감 진입 속도를 단축'
            - '화면 상단에 노출되는 데이터는 별도 `prefetch` 훅으로 사전에 워밍업하여, 본문 마운트 시점에 캐시 히트되도록 설계'
            - 스크롤 이벤트 핸들러를 JS 스레드 비차단 방식으로 처리하는 공통 훅을 도입하여, 스크롤 중에도 다른 인터랙션이 지연되지 않도록 개선

        - subject: 푸시 알림 및 딥링크 기반 진입 동선 구축
          details:
            - problem: 콜드 스타트 상태에서 푸시 클릭 시 네비게이션 스택이 준비되지 않아, 라우팅이 누락되는 케이스 발생
              solution: '전역 `store`에 `pending payload`를 적재하고, 네비게이션 `ready` 시점에 큐를 소비하여 라우팅하도록 비동기 큐 패턴 적용'
            - problem: 푸시 딥링크 목적지가 웹뷰 화면인 경우, 콜드 스타트로 진입하면 네비게이션 스택이 해당 웹뷰 단일 화면만 갖게 되어 뒤로가기 시 앱 내부 화면으로 복귀하지 않고 앱 자체가 종료되는 문제 발생
              solution: '단순 `navigate` 호출 대신 `navigation state`를 직접 구성하여, `BottomTabs`를 베이스 라우트로 두고 그 위에 `Stack`(연관 underlay 화면 + 웹뷰)을 쌓는 형태로 `reset`. 뒤로가기 시 웹뷰 → 연관 화면 → `BottomTabs` 순서로 자연스럽게 이탈하도록 흐름을 보장'
            - 백엔드 푸시 발송 API 스키마 변경에 맞춰 알림 목록 응답을 정규화하는 레이어 도입
            - '푸시 페이로드를 파싱하여 콜드 스타트 / 백그라운드 / 포그라운드 각 진입 케이스를 분기 처리하는 딥링크 핸들러 구현'

        - subject: '`Tanstack Query` 낙관적 업데이트 패턴 도입 및 표준화'
          details:
            - problem: '북마크 / 좋아요 등 토글성 `mutation`에서 서버 응답 전까지 UI 반영이 지연되어, 사용자가 동일 버튼을 반복 누르는 현상이 다수 화면에서 발생'
              solution: '`cancel → snapshot → cache update → rollback` 표준 흐름을 적용하여 서버 응답 전 즉시 UI에 반영. 실패 시 `onError` 단계에서 `snapshot` 기반 롤백과 `toast` 안내로 일관된 흐름으로 통일'
            - '`setQueryData`로 관련 화면 캐시를 직접 패치해 `invalidate`에 따른 불필요한 네트워크 라운드트립을 제거하고, 화면 간 상태 일관성 확보'

        - subject: 네이버 지도 기반 매장 탐색 화면 구현 및 검색·렌더 최적화
          details:
            - problem: '영역 필터 선택, 초기 카메라 세팅 등 코드에 의한 카메라 이동까지 사용자 조작과 동일하게 인식되어 결과 리스트 API가 중복 호출되는 문제발생'
              solution: '코드 기반 카메라 이동 여부를 별도 ref로 추적하여 사용자 직접 조작과 분리하고, 재검색 활성화 플래그를 토글하여 의미 있는 사용자 조작 시점에만 재검색이 트리거되도록 처리'
            - '지도 카메라의 중심 좌표와 위·경도 델타 값을 기반으로 가시 영역의 남서·북동 경계 좌표를 계산하는 유틸을 도입하여, 결과 리스트 API의 검색 범위 파라미터로 전달. 사용자가 보고 있는 지도 영역에 정확히 매핑된 결과만 받아오도록 구현'

        - subject: '상단 고정 영역 위에 `BottomSheet`가 상시 부분 노출되는 레이아웃에서 커스텀 당겨서 새로고침 구현'
          details:
            - problem: '상단 고정 영역(배너 등) 위로 `BottomSheet`가 부분 노출되는 복합 레이아웃에서, `BottomSheet`의 `snapPoint`를 고정 영역 하단에 맞춰 해당 영역이 항상 노출되도록 고정한 구조. 이 환경에서 표준 `RefreshControl`을 `BottomSheet` 내부 리스트에 바인딩하면 상단 고정 영역에서의 `pull` 동작이 감지되지 않아, iOS / Android 모두 당겨서 새로고침이 동작하지 않는 문제 발생'
              solution: '화면 전체를 `GestureDetector`로 감싸 `Pan Gesture`로 `pull` 동작을 직접 감지하고, `Reanimated worklet`으로 `pull` 거리에 따라 인디케이터의 위치 / 회전 / `opacity`를 동기화하는 커스텀 새로고침 흐름을 구현. 임계치 초과 시 새로고침을 트리거하고, 응답 완료 시점까지 인디케이터를 유지하는 상태 흐름을 직접 설계'
            - '`BottomSheet` 내부 스크롤 제스처와 화면 전체 `Pan Gesture`가 충돌하지 않도록 `waitFor` 옵션으로 제스처 우선순위를 조정해, 상단 고정 영역에서의 `pull`과 `BottomSheet` 내부 스크롤을 자연스럽게 분리'
            - 'iOS와 Android 각각의 인디케이터 외형 / 위치를 분기 처리하여 플랫폼 가이드라인에 맞춤'

        - subject: Claude Code 기반 개발 생산성 인프라 구축
          details:
            - 기존 RN 앱 담당 개발자의 퇴사로 도메인 지식 인계가 끊긴 상태에서, RN 앱 개발 경험이 부족한 채로 단독으로 유지보수와 신규 기능 개발을 동시에 진행해야 하는 환경에 놓임. 학습 비용 절감과 도메인 컨텍스트의 항시 참조를 위해 Claude Code 기반 보조 인프라를 직접 설계 및 구축
            - '프로젝트 규칙을 UI 생태계 / 성능 / 애니메이션 / 서버 상태 / 네비게이션 / 전역 상태 / 다국어 / 신규 기능 흐름 등 도메인별로 분리하여, 작업 키워드 기반으로 필요한 규칙만 부분 적재되는 구조로 설계'
            - '역할 분리 멀티에이전트 파이프라인 — `planner → generator → evaluator` 구현 루프에 더해, 분석 결과를 별도 `critic` 에이전트가 객관적으로 반박·검증하는 자기검증 레인을 구성하여 단일 컨텍스트 자기검증의 편향을 완화'
            - '반복 구현 패턴의 스킬화 — API 추가 / 낙관적 업데이트 뮤테이션 / 화면 진입 최적화 / 다국어 반영 등 정형화된 작업을 재사용 가능한 커맨드로 코드화하여, 컨벤션을 매번 재설명하지 않고도 일관된 산출물을 확보'
            - '작업 복잡도에 따라 모델을 라우팅(경량 조회 → 아키텍처·심층 분석)하고, 프롬프트 캐싱·추론 강도(effort)를 튜닝하여 응답 지연과 토큰 비용을 최적화'

    - startDate: '2025.07.03'
      endDate: '2025.10.16'
      title: 자사 여행 콘텐츠 예약 및 결제 플랫폼의 관리자 페이지 개발
      doneList:
        - subject: '상품 / 패키지의 생성 및 수정 폼 페이지 개발'
          details:
            - '`tiptap` 에디터와 `react-hook-form`의 `FormField`를 결합하여, 언어별 탭 UI로 제목 / 설명 / 이미지를 분리 입력할 수 있도록 개발 (한국어, 영어, 일본어, 중국어 간체, 중국어 번체)'
            - 날짜 기간별 데이터를 관리하는 폼을 구현하고, 특정 날짜 또는 공휴일을 선택해 일괄적으로 데이터를 수정할 수 있는 기능을 개발
            - '`zustand`로 상품/패키지 폼 데이터를 관리하고 `localStorage`에 저장하여 페이지 이탈 후에도 복구가 가능한 임시저장 기능 개발. `JSON` 파싱을 `Zod` 스키마로 검증해 안정성을 높임'
            - problem: '`react-hook-form`의 `useFieldArray` 로 관리되는 데이터에서, 서버에서 주는 데이터의 `id`와 `useFieldArray` 자체 key인 `id` 간의 충돌로 인해 기존 데이터와 새로 추가된 데이터가 구분되지 않아, 잘못된 데이터가 전달될 위험 발생'
              solution: '`useFieldArray`의 `keyName`에 커스텀 ID를 부여해 데이터 기존 / 새 데이터를 명확히 구분하고, 사용자가 수정한 데이터를 정확하게 반영하도록 구현'
            - problem: 각각의 다국어 이미지 등록 시, 영어를 기준으로 이미지를 복사해 다른 언어의 이미지에도 업로드하도록 구현했으나, 동일한 이미지의 업로드 API 요청이 복사된 언어의 수만큼 중복 호출되는 문제가 발생
              solution: 영어 버전 이미지의 `ID`를 다른 언어들과 공유하도록 구조를 변경하여, 동일 이미지의 중복 업로드 문제를 완화함. 또한 이미지를 교체할 때는 공유된 이미지 ID를 기준으로 연동된 모든 언어의 이미지가 함께 교체되도록 처리하여 일관성을 유지함

        - subject: i18next를 활용한 다국어 기능 개발 (영어, 중국어 간체 / 번체)
          details:
            - zod validation의 에러 메시지 + dayjs 시간 포메팅 표현을 다국어로 구현
            - problem: 모든 번역 `JSON` 파일을 한 번에 번들링하면 초기 로딩 속도가 느려지는 성능 문제가 발생
              solution: '`resourcesToBackend`를 활용해 필요한 언어와 namespace만 동적으로 import하는 lazy loading 방식으로 개선하여 로딩 성능 최적화'
            - problem: zod의 refine 등을 활용한 커스텀 에러 메시지는 React 초기화 시점에 메시지 값이 고정되어, 언어를 변경해도 에러 메시지의 언어가 변경되지 않는 문제에 직면
              solution: 검증 로직에서는 에러 메시지의 번역 키만 저장하고, 화면 렌더링 시점에 번역 로직을 적용하도록 개선하여, 언어 변경 시 기존 에러 메시지도 실시간으로 변경되도록 구현
    - startDate: '2025.09.24'
      endDate: '2025.10.02'
      title: Wix로 제작된 여행 플랫폼 웹사이트를 Next.js 환경으로 전환
      doneList:
        - subject: '데스크톱, 태블릿, 모바일 환경에 대응하는 반응형 디자인 구현'
        - subject: 'Docker, ECR, GitHub Actions를 이용한 CI/CD 파이프라인 구축'

    - startDate: '2025.04.14'
      endDate: '2025.07.02'
      title: 자사 애플리케이션 관리자 페이지 시스템 고도화 및 유지보수
      doneList:
        - subject: 기존 관리자 페이지 기능 리뉴얼
          details:
