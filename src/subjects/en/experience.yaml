- companyName: Wonder Round Inc.
  startDate: '2025.04.14'
  activities:
    - id: wonder-design-system-2026
      startDate: '2026.09.20'
      title: 'Built a React Native design system and a Claude Code–based prototyping environment'
      shortTitle: 'Design system'
      doneList:
        - subject: Designed a design system that manages design values and components in one place
          details:
            - problem: 'Designers, planners, and developers handed work to each other in turn — idea → planning → mockup → Figma → development — and bottlenecks at each stage meant a single task took 4–6 weeks on average.'
              solution: 'Designed and built a design system and a `react-native-web`–based preview environment where real app screens can be made right away with the same design rules and components, and checked from a single browser link without a development setup. Introduced together with the Claude Code workspace, it cut the time per task to about 1–2 weeks on average.'
            - 'Managed design values such as colors, type, and corner rounding in a single token file, and used a `Style Dictionary` build to convert them automatically into the form the app (`Tamagui` theme) and the web (CSS variables) each need. App screens use only the components the design system package provides, so even if the styling approach changes later, only the package internals need to change while the screens stay as they are.'

        - subject: Designed a Claude Code workspace where designers and planners build screens themselves while rules and permissions are enforced automatically
          details:
            - 'Organized the workflow into skills so that drafting screens, changing design rules, and exchanging screens with Figma can all be done just by talking to Claude Code. Let Figma changes reach screens only after they are first reflected in the design standard documents, so the result is the same no matter who builds it.'
            - 'Instead of relying on people to remember, set up custom `ESLint` rules and type checks that automatically block colors or sizes written outside the design system, other UI libraries, and calls to a real server.'
            - problem: 'On the GitHub free plan, basic safeguards such as branch protection and CODEOWNERS are unavailable for private repositories, so a worker unfamiliar with development could accidentally push to `main` or run a deploy.'
              solution: 'Used a Claude Code `hook` to check the worker role right before a command runs and block `main` pushes, PR merges, and deploy commands for anyone who is not a developer. Arranged the flow so every change goes through a PR and CI (lint / typecheck) and is applied only after developer review.'

        - subject: Designed the handoff and rollout structure that carries finished screens into the real app
          details:
            - 'For every finished screen draft, generated a handoff spec that AI agents in the app and API repositories can read and implement directly. Split it into app and API versions and listed what is out of scope, what was assumed, and an acceptance checklist, so the same screen can be rebuilt in another repository.'
            - 'Moved existing app screens into the design system while keeping their current look, and bundled designer improvements separately through pinned package versions and change records (`changesets`) so problems introduced during the move never mix with intended changes. Libraries tied to native behavior — toasts, bottom sheets, and images — stay in the app while the design system provides only the visual parts, keeping changes to existing call sites to a minimum.'
            - problem: 'Webview screens opened inside the app were drawn in a different style from the app, so two designs were mixed within one app.'
              solution: 'Instead of building separate webview components, had webviews use the same design system as the app via `react-native-web`, so native and webview screens share a single design standard.'

    - id: wonder-agent-harness-2026
      startDate: '2026.05.01'
      title: 'Designed a Claude Code–based AI agent development harness'
      shortTitle: 'Claude Code harness'
      doneList:
        - subject: Organized rule ownership and designed the harness bootstrap system
          details:
            - 'When the previous RN app developer left, the project had effectively no AI agent harness in place and RN domain knowledge handover was cut off. To reduce the learning cost and keep context always at hand, I designed and introduced a Claude Code–based development assist harness from scratch.'
            - 'After the initial design, I used my own plugin [`thinkit`](#portfolio-thinkit) to repeatedly audit and improve the harness from the perspectives of rule ownership, prose/tool separation, and safety boundaries — applying the principles I set to my own output and keeping the harness itself under continuous review.'

        - subject: Automated domain knowledge and repeated patterns as skills
          details:
            - 'Modularized per-domain rules and architecture decisions (UI ecosystem / performance / animation & gestures / server state / navigation / global state / i18n / error boundaries / new feature flow) into skills and rules, organizing them into a reference structure that loads as context when needed instead of re-explaining conventions and background on every task.'
            - 'Automated repeated implementation patterns as skill commands — the flow of adding a new API (response type definitions · TanStack Query hook generation · cache key registration) runs in one command, and recurring work such as optimistic-update mutations / screen entry optimization / i18n updates / Android build and native troubleshooting yields consistent results.'

        - subject: 'Built a final-diff review pipeline based on a separate code review skill'
          details:
            - 'Once a feature is complete, a separate code review skill is invoked to split the final diff between the working branch and the target version branch into two independent lanes (items that can be judged within the diff / items that need repository-wide exploration), and subagents review them in parallel. To keep perspectives from overlapping, each lane reaches its conclusion independently without sharing results with the other.'
            - 'Passed the parallel review results to a refutation step that weakens or drops overreaching findings, while marking data loss · auth/permissions/payments · immediate crashes · hard-to-roll-back migrations as categories that cannot be weakened, so critical findings are never buried. Gated the flow so that if even one CRITICAL / HIGH finding survives, the merge command is not printed at all — so whether a review passes is decided by the numbers alone.'

    - id: wonder-rn-app-2026
      startDate: '2026.02.04'
      title: 'Role transition — Development and maintenance of an in-house React Native (CLI) mobile application'
      shortTitle: 'In-house RN app'
      doneList:
        - subject: 'Built the operating framework for the OTA (over-the-air code delivery) infrastructure `hot-updater`'
          details:
            - 'To resolve the structure where urgent bug fixes and QA changes were delayed by the store review cycle, I newly introduced an OTA pipeline with `hot-updater` that delivers JS bundles over the air without review. Designed and built the whole flow — bundle store integration, per-environment management for iOS / Android and `dev` / `beta` / `pro`, and the deploy/rollback operations flow.'
            - problem: 'Initially all environments shared channels and settings, so a higher-environment bundle could overwrite a lower-environment native build, or a missed settings swap before deploy left the bundle and native mismatched. Wrong key settings repeatedly crashed social login.'
              solution: 'Separated deploy destinations by an `appVersion` + channel (`dev` / `beta` / `production`) combination, and automated injecting channel/environment settings at build time. Made the `set-<env>` → deploy → restore `dev` procedure a shared rule so bundles always reach only the intended environment, preventing environments from mixing.'
            - problem: 'In certain situations the app fell into a force-update (`force update`) infinite loop, making normal entry itself impossible — a critical failure.'
              solution: 'Added rollback instrumentation that detects the boot-failure loop (current bundle id === minimum bundle id → confirmed boot failure), and secured a manual kill switch that can be reverted immediately via console/DB, establishing a failure-response procedure.'

        - subject: Introduced a staged-mount pattern to optimize entry performance on key screens
          details:
            - problem: 'On heavy screens that accumulate many `hooks` and API calls (lists / map / detail), every widget mounts at the same time on entry, which makes the navigation animation stutter and delays the appearance of the `skeleton`.'
              solution: 'Split the screen into entry point and body in two stages — show the `skeleton` immediately right after the navigation transition, and detect the end of the transition with `setImmediate` so the body only mounts after the animation finishes. Shortened perceived entry lag from ~700–800ms to ~200–300ms.'
            - 'Loaded data shown at the top of the screen in advance with a separate `prefetch` hook, so it is a cache hit by the time the body mounts.'
            - 'Preloaded key images before screen entry to minimize images appearing late or flickering on first render.'

        - subject: Consolidated recurring app-wide performance and data-handling issues into shared rules
          details:
            - 'Moved animations that heavily loaded the JS thread to run directly on the UI thread with Reanimated, keeping them smooth without frame drops during scrolling and transitions.'
            - 'Organized a `cancel → snapshot → cache update → rollback` flow for toggle-like `mutation`s (bookmark / like) as a shared rule, so immediate UI reflection before the server responds and consistent rollback on failure became a common pattern. Direct cache patching with `setQueryData` also removed unnecessary `invalidate` round-trips.'
            - 'Recognized that OS-level HTTP caches such as iOS `NSURLCache` / Android `OkHttp` exist separately beneath the TanStack Query cache, and handled cases where invalidating the JS cache alone did not surface fresh data. Defined a policy that covers both layers by combining response header (`Cache-Control`) rules, request options, and cache bypass when needed.'

        - subject: Built push notification and deep link entry flows
          details:
            - problem: When a push is tapped from a cold start, the navigation stack is not ready yet, so routing is sometimes dropped.
              solution: 'Stored the `pending payload` in a global `store` and consumed the queue once navigation is `ready`, applying an async-queue pattern for routing.'
            - problem: When the deep link target is a webview screen and the app is launched from a cold start, the navigation stack ends up containing only that single webview, so pressing back terminates the app instead of returning to the previous in-app screens.
              solution: 'Instead of a plain `navigate` call, I composed the `navigation state` directly to `reset` it into a structure where `Main Tab screen` is the base route and a `Stack` (related underlay screen + webview) is stacked on top. This guarantees a natural back flow: webview → related screen → `Main Tab screen`.'
            - Added a normalization layer for the notification list response to match the updated push-sending API schema on the backend.
            - 'Implemented a deep link handler that parses the push payload and handles cold-start / background / foreground entry cases separately.'

    - id: wonder-admin-travel-2025
      startDate: '2025.07.03'
      endDate: '2025.10.16'
      title: Built the admin page for an in-house travel content reservation and payment platform
      shortTitle: Travel platform admin
      doneList:
        - subject: 'Built the create / edit form pages for products and packages'
          details:
            - 'Combined the `Tiptap` editor with `react-hook-form` `FormField` to allow per-language tabs for separately entering title / description / images (Korean, English, Japanese, Simplified Chinese, Traditional Chinese).'
            - Built a form for managing data per date range, with the ability to bulk-edit data by selecting specific dates or holidays.
            - 'Managed product/package form data with `zustand` and persisted it to `localStorage`, building a temporary save feature so users can recover after leaving the page. `JSON` parsing is validated with a `Zod` schema for stability.'
            - problem: 'In data managed by `react-hook-form` `useFieldArray`, the server-provided `id` collided with the `useFieldArray` internal `id` key, making it impossible to distinguish existing data from newly added data — risking sending wrong data.'
              solution: 'Assigned a custom ID to `useFieldArray` `keyName` to clearly distinguish existing vs. new data, ensuring user edits are reflected accurately.'
            - problem: When registering localized images, I implemented copying from English as the source so the same image is uploaded for the other languages — but the upload API was being called once per copied language.
              solution: Restructured so that the English version image `ID` is shared across the other languages, mitigating the duplicate upload problem. Also, on image replacement, the linked images for all sharing languages are replaced together based on the shared image ID, keeping everything consistent.

        - subject: Built i18n features using i18next (English, Simplified / Traditional Chinese)
          details:
            - Implemented zod validation error messages + dayjs time formatting expressions in multiple languages
            - problem: 'Bundling all translation `JSON` files at once caused slow initial load.'
              solution: 'Improved this with lazy loading via `resourcesToBackend`, dynamically importing only the languages and namespaces we need.'
            - problem: Custom error messages built with zod `refine` and similar were frozen at React init time, so the error message language did not change when the user switched locale.
              solution: Stored only the translation key in the validation logic and applied translation at render time, so existing error messages also update in real time on locale change.

    - id: wonder-admin-enhance-2025
      startDate: '2025.04.14'
      endDate: '2025.07.02'
      title: Enhanced and maintained the in-house application admin page system
      shortTitle: Admin system upgrade
      doneList:
        - subject: Renewed existing admin page features
          details:
            - On the list page, added a copy feature that pre-fills the create form with values including images and dependent child data when a specific item is selected.
            - On critical content edits, built a UI that visualizes before/after values per field as `JSON` to track change history.
            - 'Replaced `Toast UI Editor` with `Tiptap Editor` and extended it with image upload loading state and delete-during-upload handling.'
            - 'Built an image editing (Crop/Zoom) UI with `react-easy-crop`.'
        - subject: Designed and implemented a dashboard page using traffic / user activity / content data
          details:
            - 'Adopted `Recharts` to build line / bar / pie chart UIs, and customized labels, axes, and tooltips per chart.'
            - Aggregated monthly data per year as averages and visualized them on charts so annual trends and monthly changes can be grasped at a glance.
            - 'Added a feature that, when querying a date range, also shows the equivalent previous range for comparison (e.g., last 7 days vs. the 7 days before that).'
            - problem: 'Implemented period selection via a `Select` (last 7 days / last 14 days / etc.), but each selection re-rendered the whole screen to fetch new data — a UX issue.'
              solution: '`prefetch`-ed the dataset for each `Select` option in advance, so selecting an option swaps the data instantly without a screen transition.'
            - problem: When querying statistics for a custom date range, unintended other queries were also being re-fetched.
              solution: Separated fixed data queries from period-specific statistics queries to clearly partition cache per query, minimizing API calls.
        - subject: 'Adopted `vitest` and wrote TDD test code for general admin page features'
          details:
            - problem: 'Existing `React Router`-based components did not render or navigate properly in the test environment (`Vitest` + `JSDOM`).'
              solution: 'Built a custom render util including `MemoryRouter` and `TanStack Query Provider`. Designed nested routing and routing state via `mock` so the test environment closely mirrors the actual runtime.'
            - problem: 'Components using `Portal` (e.g., `Dropdown`, `Modal`) did not detect trigger element click events in the test environment, rendering differently from the real UI flow.'
              solution: 'Resolved this by introducing `userEvent`, which triggers test-environment screen flows smoothly, like a real user.'
- companyName: Korea Global Knowledge Network Inc.
  startDate: '2024.03.11'
  endDate: '2025.03.21'
  activities:
    - id: kgkn-admin-site-2025
      startDate: '2025.01.16'
      endDate: '2025.03.21'
      title: Built the dedicated admin site for an existing in-house platform
      doneList:
        - subject: Built question bank management features needed for quizzes
          details:
            - 'Refreshed question data with `TanStack Query` `invalidateQueries` after choice add/edit/delete, then sorted by the latest choice data and called the order-change API for accuracy.'
        - subject: Built management features for course composition units (chapters / sections / VOD / quiz / hands-on)
          details:
            - problem: Configuration values required for hands-on, VOD, etc. differed, so providing a single consistent form was hard, and UI complexity grew.
              solution: Built independent forms per content type and rendered them dynamically based on the selected type, easing UI complexity and improving usability.
    - id: kgkn-external-course-2024
      startDate: '2024.11.18'
      endDate: '2025.01.15'
      title: Built a course-taking site / admin & operator site for external companies
      shortTitle: B2B course-taking site
      doneList:
        - subject: Built a real-time pop-quiz feature using WebSocket, enabling instant interaction between instructor and learners during live lectures
          details:
            - problem: A real-time data-driven chart updated so quickly that it could not render the actual data values.
              solution: 'Applied `throttle` to the result data state to reduce unnecessary updates and render reliably without data loss. From up to ~1500 updates per second (number of users in the live meeting, ~1500) → throttled to 1 update per 50ms (~20 updates per second). CPU usage dropped by ~20%.'
            - problem: When the network briefly dropped right before a pop-quiz started and reconnected, the just-started pop-quiz did not appear.
              solution: Added reconnection logic. Compared the WebSocket ping-pong count values — if the websocket reconnected with mismatched counts, treated it as a reconnection. Then re-fetched the in-progress pop-quiz via API to resolve.
            - problem: With many users reconnecting at once, there was a risk of server load.
              solution: 'Applied exponential backoff to reconnection attempts and added jitter (randomness) to spread concurrent requests, minimizing server load. Maximum simultaneous reconnection requests dropped from ~1500 (live meeting attendees, ~1500) → ~1/10 (~150).'
        - subject: Designed UI separating features and permissions appropriate for admin and operator roles
          details:
            - problem: 'When accessing URLs requiring specific permissions, the middleware that checks permissions before access was implemented using `React Router DOM` `loader`, but it completed execution before the user info was loaded.'
              solution: 'Built a route guard component directly using `React Router DOM` `Outlet` and `Navigate` to check authenticated users first when accessing protected pages. If allowed, render child routes; otherwise block access.'
    - id: kgkn-platform-enhance-2024
      startDate: '2024.10.01'
      endDate: '2024.11.15'
      title: Enhanced and maintained the existing platform
      doneList:
        - subject: Built a table component supporting infinite scroll / Drag & Drop
          details:
            - problem: The measured height of each `row` in infinite scroll was inconsistent, so virtualized table scroll caused data not to appear or the UI to shift.
              solution: 'Set an `estimateSize` value to estimate initial `row` height, then dynamically updated based on the actual rendered `row` height to resolve the issue.'
    - id: kgkn-coding-test-2024
      startDate: '2024.08.02'
      endDate: '2024.10.01'
      title: Built a dedicated coding test platform
      doneList:
        - subject: 'Built a coding editor for solving problems by customizing `CodeMirror`'
          details:
            - Customized CSS styles using the library's built-in `class` and configured a theme so it works in dark mode too.
            - When code lines are folded, or when a custom placeholder style is needed, applied designs that fit varying requirements using CSS pseudo-elements.
            - Applied responsive design using `flex` and `grid`-related properties so it works smoothly on tablets too.
        - subject: Built UI and features so users can solve coding test problems and submit answers to check correctness
          details:
            - problem: 'To persist the user-written code, used `zustand` `persist (localStorage)` — but as data grew per problem and language, management became difficult.'
              solution: 'Used the problem `id` as the object `key`, nested per language, and stored user code as a `JSON` string. To minimize storage, kept only the latest 10 problems.'
            - problem: Submitted problems took long to grade, degrading UX.
              solution: Showed a skeleton UI during the wait so users could perceive that processing was in progress.
        - subject: Built an admin page to manage problems using React Hook Form and Zod
          details:
            - problem: Combining the problem details / language and memory/time-limit selection / default test cases into one form made the UI complex and hard to maintain.
              solution: Split the related items into 3 main tabs and pre-validated when moving between tabs. Validation logic is managed in a global store, and each tab sets its validation function on mount to keep the logic consistent.
    - id: kgkn-lms-2024
      startDate: '2024.05.27'
      endDate: '2024.06.28'
      title: LMS development
      doneList:
        - subject: Project design, common layout/component structuring, feature modularization
          details:
            - problem: Feedback from a prior project showed it was hard to maintain features at the unit level and scaling was problematic.
              solution: 'Adopted FSD folder structure to modularize components and features efficiently. Defined a feature unit as an "entity" and managed API, schema, type, and global state together to improve scalability.'
        - subject: Built core features — exam evaluation & assignment submission & survey & my page, etc.
          details:
            - problem: 'When solving problems, doing answer-sheet creation and selected-answer checking via API in a single "Submit" click was inefficient, and a network drop during the exam caused data loss.'
              solution: 'On entering the exam page, called an API to create the user’s answer sheet in advance, and sent a PATCH request to the server every time the user marks an answer to save exam progress in real time. Data loss during exams dropped from ~10/50 → 0/50.'
    - id: kgkn-online-platform-2024
      startDate: '2024.03.11'
      endDate: '2024.05.24'
      title: Built the in-house platform for an online IT education site
      shortTitle: IT education platform
      doneList:
        - subject: Customized a text editor using the Tiptap library
          details:
            - problem: The Framer Motion library introduced for comment-area animation caused unintended layout changes when the animated element overlapped with other UI elements.
              solution: 'Resolved by injecting the animation state into the component `key` and wrapping the component with `AnimatePresence` so layout changes are detected.'
  note:
    reasonForLeaving: 'Left due to commute difficulties after a workplace relocation (Incheon ↔ Gasan Digital Complex changed to Incheon ↔ Gangnam)'
    description: Formerly Coding Hub, acquired and merged into Korea Global Knowledge
